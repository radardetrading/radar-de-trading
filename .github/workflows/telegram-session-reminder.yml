name: Telegram Session Reminder

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:        # también se puede disparar a mano desde GitHub

jobs:
  reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enviar recordatorio de sesión por Telegram
        run: node scripts/telegram-session-reminder.js
        env:
          SUPABASE_URL: https://mbcdwdpaxrcaplfnjsml.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

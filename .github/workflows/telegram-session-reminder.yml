name: Telegram Session Reminder

# Reemplazado por pg_cron + la Edge Function session-reminder (supabase/functions/session-reminder) —
# el cron de GitHub Actions se demoraba horas en lugar de los 15 min configurados en este repo
# publico de poco trafico (ver TELEGRAM-WEBHOOK-FIX.md).
# Se deja workflow_dispatch como herramienta manual de respaldo, ya sin cron automático.
on:
  workflow_dispatch:

jobs:
  reminder:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enviar recordatorio de sesión por Telegram
        run: node scripts/telegram-session-reminder.js
        env:
          SUPABASE_URL: https://mbcdwdpaxrcaplfnjsml.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

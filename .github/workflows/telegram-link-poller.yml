name: Telegram Link Poller

# Reemplazado por el webhook de Supabase Edge Functions (supabase/functions/telegram-webhook) —
# el cron de GitHub Actions se demoraba horas en lugar de los 10 min configurados.
# Se deja workflow_dispatch como herramienta manual de respaldo, ya sin cron automático.
on:
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Vincular codigos pendientes
        run: node scripts/telegram-link-poller.js
        env:
          SUPABASE_URL: https://mbcdwdpaxrcaplfnjsml.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

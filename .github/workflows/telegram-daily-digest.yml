name: Telegram Daily Digest

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC = 08:00 Argentina
  workflow_dispatch:        # también se puede disparar a mano desde GitHub

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enviar resumen de alertas por Telegram
        run: node scripts/telegram-daily-digest.js
        env:
          SUPABASE_URL: https://mbcdwdpaxrcaplfnjsml.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

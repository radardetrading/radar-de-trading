name: Telegram Daily Digest

on:
  schedule:
    - cron: '7 11 * * *'   # 11:07 UTC = 08:07 Argentina (desalineado del :00 para evitar demoras de cola en GitHub Actions)
  workflow_dispatch:        # también se puede disparar a mano desde GitHub

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enviar resumen de alertas por Telegram
        run: node scripts/telegram-daily-digest.js
        env:
          SUPABASE_URL: https://mbcdwdpaxrcaplfnjsml.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
